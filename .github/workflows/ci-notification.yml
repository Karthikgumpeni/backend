name: Notification Service CI

on:
  push:
    branches:
      - main
      - develop
      - "feature/**"
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  security-events: write

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: notification-service

jobs:
  build-and-push:
    name: Build, Scan and Push Notification Service
    runs-on: ubuntu-latest

    steps:
      # ---------------------------------------------------------
      # 1. Checkout
      # ---------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # ---------------------------------------------------------
      # 2. Setup Node
      # ---------------------------------------------------------
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: notification-service/package-lock.json

      # ---------------------------------------------------------
      # 3. Install dependencies
      # ---------------------------------------------------------
      - name: Install dependencies
        working-directory: notification-service
        run: npm ci

      # ---------------------------------------------------------
      # 4. NPM security audit
      # ---------------------------------------------------------
      # IMPORTANT:
      # npm audit can return exit code 1 when vulnerabilities
      # are found. We don't want that to stop the Docker build.
      # ---------------------------------------------------------
      - name: NPM Security Audit
        working-directory: notification-service
        continue-on-error: true
        run: npm audit --audit-level=high

      # ---------------------------------------------------------
      # 5. Build application
      # ---------------------------------------------------------
      - name: Build notification service
        working-directory: notification-service
        run: |
          if npm run | grep -q "build"; then
            npm run build
          else
            echo "No build script found. Skipping application build."
          fi

      # ---------------------------------------------------------
      # 6. Configure AWS using GitHub OIDC
      # ---------------------------------------------------------
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::076429318738:role/pharma-github-actions-role
          aws-region: ${{ env.AWS_REGION }}
          audience: sts.amazonaws.com

      # ---------------------------------------------------------
      # 7. Login to Amazon ECR
      # ---------------------------------------------------------
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # ---------------------------------------------------------
      # 8. Set image variables
      # ---------------------------------------------------------
      - name: Set image variables
        id: image
        run: |
          echo "registry=${{ steps.login-ecr.outputs.registry }}" >> "$GITHUB_OUTPUT"
          echo "image=${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}" >> "$GITHUB_OUTPUT"
          echo "tag=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      # ---------------------------------------------------------
      # 9. Verify ECR repository
      # ---------------------------------------------------------
      - name: Verify ECR repository
        run: |
          aws ecr describe-repositories \
            --repository-names "${ECR_REPOSITORY}" \
            --region "${AWS_REGION}"

      # ---------------------------------------------------------
      # 10. Build Docker image
      # ---------------------------------------------------------
      - name: Build Docker image
        run: |
          docker build \
            -t "${{ steps.image.outputs.image }}:${{ steps.image.outputs.tag }}" \
            -t "${{ steps.image.outputs.image }}:latest" \
            ./notification-service

      # ---------------------------------------------------------
      # 11. Trivy vulnerability scan
      # ---------------------------------------------------------
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        continue-on-error: true
        with:
          image-ref: ${{ steps.image.outputs.image }}:${{ steps.image.outputs.tag }}
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: true

      # ---------------------------------------------------------
      # 12. Upload Trivy SARIF
      # ---------------------------------------------------------
      # hashFiles prevents failure if Trivy didn't create the file.
      # ---------------------------------------------------------
      - name: Upload Trivy results to GitHub
        if: always() && hashFiles('trivy-results.sarif') != ''
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-results.sarif
          category: trivy-notification-service

      # ---------------------------------------------------------
      # 13. Push image to ECR
      # ---------------------------------------------------------
      - name: Push Docker image to ECR
        run: |
          docker push "${{ steps.image.outputs.image }}:${{ steps.image.outputs.tag }}"
          docker push "${{ steps.image.outputs.image }}:latest"

      # ---------------------------------------------------------
      # 14. Verify pushed image
      # ---------------------------------------------------------
      - name: Verify image in ECR
        run: |
          aws ecr describe-images \
            --repository-name "${ECR_REPOSITORY}" \
            --region "${AWS_REGION}" \
            --image-ids imageTag="${{ steps.image.outputs.tag }}"

      # ---------------------------------------------------------
      # 15. Print image information
      # ---------------------------------------------------------
      - name: Display image
        run: |
          echo "============================================"
          echo "Notification Service image pushed:"
          echo "${{ steps.image.outputs.image }}:${{ steps.image.outputs.tag }}"
          echo "============================================"
